# Local/deployment orchestration for the full platform (section 22).
# `docker compose up` brings up Postgres, Redis, the API (with the OIDC
# provider mounted inside it), all four frontends, and Nginx as the single
# entrypoint. Copy apps/api/.env.example to apps/api/.env before running.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sso
      POSTGRES_PASSWORD: sso
      POSTGRES_DB: sso
    ports:
      # Host-side port only — container-to-container traffic inside compose
      # still uses 5432 regardless. Remapped because 5432 is commonly taken
      # by another project's Postgres already running on the host.
      - '127.0.0.1:5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sso']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sessions and OIDC grants live in Redis — without AOF persistence + a
    # volume, a plain container restart (not even a crash) silently logs out
    # every active user platform-wide.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # Same story as postgres above — host-side remap only.
      - '127.0.0.1:6381:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    # Secrets (COOKIE_SECRET, CLIENT_SECRET_ENCRYPTION_KEY, OIDC_JWKS, SMTP_*) come from here;
    # anything host/URL-shaped is overridden below to match the Nginx
    # *.sso.test domains instead of the bare-metal-dev ports in .env.example.
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://sso:sso@postgres:5432/sso
      REDIS_URL: redis://redis:6379
      SSO_BASE_URL: http://sso.sso.test
      ADMIN_BASE_URL: http://admin.sso.test
      DEMO_APP_A_BASE_URL: http://app-a.sso.test
      DEMO_APP_B_BASE_URL: http://app-b.sso.test
      OIDC_ISSUER: http://api.sso.test
      SEED_DATABASE: 'true'
      MIGRATE_DATABASE: 'true'
      TRUST_PROXY: 'loopback, uniquelocal'
      SEED_DEMO_APP_A_CLIENT_ID: demo-app-a
      SEED_DEMO_APP_A_CLIENT_SECRET: local-demo-app-a-secret
      SEED_DEMO_APP_A_REDIRECT_URI: http://app-a.sso.test/callback
      SEED_DEMO_APP_A_POST_LOGOUT_URI: http://app-a.sso.test
      SEED_DEMO_APP_B_CLIENT_ID: demo-app-b
      SEED_DEMO_APP_B_CLIENT_SECRET: local-demo-app-b-secret
      SEED_DEMO_APP_B_REDIRECT_URI: http://app-b.sso.test/callback
      SEED_DEMO_APP_B_POST_LOGOUT_URI: http://app-b.sso.test
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 10s
      timeout: 5s
      retries: 10

  sso-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        APP: sso-web
        PORT: '3000'
        NEXT_PUBLIC_API_URL: http://api.sso.test
        NEXT_PUBLIC_ALLOWED_RETURN_ORIGINS: http://admin.sso.test
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy

  admin-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        APP: admin-web
        PORT: '3001'
        NEXT_PUBLIC_API_URL: http://api.sso.test
        NEXT_PUBLIC_SSO_WEB_URL: http://sso.sso.test
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      api:
        condition: service_healthy

  demo-app-a:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        APP: demo-app-a
        PORT: '3002'
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_APP_URL: http://app-a.sso.test
      OIDC_ISSUER: http://api.sso.test
      OIDC_INTERNAL_URL: http://api:4000
      OIDC_CLIENT_ID: demo-app-a
      OIDC_CLIENT_SECRET: local-demo-app-a-secret
      SESSION_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      COOKIE_SECURE: 'false'
    ports:
      - '127.0.0.1:3002:3002'
    depends_on:
      api:
        condition: service_healthy

  demo-app-b:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        APP: demo-app-b
        PORT: '3003'
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_APP_URL: http://app-b.sso.test
      DEMO_APP_A_URL: http://app-a.sso.test
      OIDC_ISSUER: http://api.sso.test
      OIDC_INTERNAL_URL: http://api:4000
      OIDC_CLIENT_ID: demo-app-b
      OIDC_CLIENT_SECRET: local-demo-app-b-secret
      SESSION_SECRET: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
      COOKIE_SECURE: 'false'
    ports:
      - '127.0.0.1:3003:3003'
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '127.0.0.1:80:80'
    depends_on:
      - sso-web
      - admin-web
      - demo-app-a
      - demo-app-b
      - api

volumes:
  postgres-data:
  redis-data:
