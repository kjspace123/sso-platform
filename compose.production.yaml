# Run separately from compose.yaml; see docs/production.md.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sso
      POSTGRES_DB: sso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sso]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis-data:/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: ${PRODUCTION_ENV_FILE:-./docker/production.env}
    environment:
      NODE_ENV: production
      PORT: 4000
      SSO_BASE_URL: https://${SSO_HOST:?Set SSO_HOST}
      ADMIN_BASE_URL: https://${ADMIN_HOST:?Set ADMIN_HOST}
      OIDC_ISSUER: https://${API_HOST:?Set API_HOST}
      # Demo clients are deliberately absent from this deployment.
      DEMO_APP_A_BASE_URL: https://${SSO_HOST}
      DEMO_APP_B_BASE_URL: https://${SSO_HOST}
      TRUST_PROXY: 172.30.50.10/32
      SEED_DATABASE: 'false'
      MIGRATE_DATABASE: 'false'
    networks: [backend, edge]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:4000/health]
      interval: 10s
      timeout: 5s
      retries: 10
  sso-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        APP: sso-web
        PORT: '3000'
        NEXT_PUBLIC_API_URL: https://${API_HOST}
        NEXT_PUBLIC_ALLOWED_RETURN_ORIGINS: https://${ADMIN_HOST}
    restart: unless-stopped
    networks: [edge]
  admin-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        APP: admin-web
        PORT: '3001'
        NEXT_PUBLIC_API_URL: https://${API_HOST}
        NEXT_PUBLIC_SSO_WEB_URL: https://${SSO_HOST}
    restart: unless-stopped
    networks: [edge]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      SSO_HOST: ${SSO_HOST}
      ADMIN_HOST: ${ADMIN_HOST}
      API_HOST: ${API_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge: {ipv4_address: 172.30.50.10}
    depends_on: [api, sso-web, admin-web]
networks:
  backend:
    internal: true
  edge:
    ipam:
      config: [{subnet: 172.30.50.0/24}]
volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
