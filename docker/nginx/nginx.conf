worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Every service has its own origin under one registrable development site.
  # This mirrors production subdomains while keeping SameSite cookies usable.
  # See README.md for the required one-line hosts-file entry.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Baseline security headers for every proxied app (section 16). None of the
  # server blocks below redefine add_header, so these are inherited by all of
  # them. Scoped deliberately narrow: frame-ancestors/X-Frame-Options block
  # clickjacking (the concrete risk for sso-web's login/consent pages being
  # iframed by a phishing page) without a full script-src/style-src CSP,
  # which would need per-app tuning against Next.js's actual asset origins
  # before it's safe to turn on. Strict-Transport-Security is a no-op over
  # plain HTTP (browsers ignore it) and takes effect automatically once this
  # config is fronted by TLS.
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  server {
    listen 80;
    server_name sso.sso.test;
    location / {
      proxy_pass http://sso-web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 80;
    server_name admin.sso.test;
    location / {
      proxy_pass http://admin-web:3001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 80;
    server_name app-a.sso.test;
    location / {
      proxy_pass http://demo-app-a:3002;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 80;
    server_name app-b.sso.test;
    location / {
      proxy_pass http://demo-app-b:3003;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 80;
    server_name api.sso.test;
    location / {
      proxy_pass http://api:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
