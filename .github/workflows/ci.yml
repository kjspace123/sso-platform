name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR so pushes don't queue behind
# stale CI runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned by root package.json's
      # "packageManager" field, and must run before actions/setup-node's
      # cache:pnpm option, which shells out to `pnpm store path`.
      - uses: pnpm/action-setup@v4

      # Matches docker/*.Dockerfile's node:22-alpine so CI exercises the same
      # runtime that actually ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Build shared packages
        run: pnpm build:packages

      - name: Dependency security audit
        run: pnpm audit --prod

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sso
          POSTGRES_PASSWORD: sso
          POSTGRES_DB: sso_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sso" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      API_RATE_LIMIT: 2000
      OIDC_RATE_LIMIT: 2000
      NODE_ENV: test
      DATABASE_URL: postgresql://sso:sso@localhost:5432/sso_test
      REDIS_URL: redis://localhost:6379
      SSO_BASE_URL: http://localhost:3000
      ADMIN_BASE_URL: http://localhost:3001
      DEMO_APP_A_BASE_URL: http://localhost:3002
      DEMO_APP_B_BASE_URL: http://localhost:3003
      OIDC_ISSUER: http://localhost:4000
      # CI-only, thrown away with the runner — not a real secret, just needs
      # to satisfy the schema's shape (32 bytes base64 / 32+ char string).
      CLIENT_SECRET_ENCRYPTION_KEY: 'bH7eqt2DhitgiPGu7FRg1coH8EgTDln4WyVutSuR27c='
      COOKIE_SECRET: 'ci-only-test-cookie-secret-never-used-in-prod'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Build shared packages
        run: pnpm build:packages

      - name: Apply migrations
        run: pnpm --filter @sso-platform/api exec prisma migrate deploy

      - name: Seed baseline roles/permissions
        run: pnpm --filter @sso-platform/api exec prisma db seed

      - name: E2E tests
        run: pnpm --filter @sso-platform/api test:e2e

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
